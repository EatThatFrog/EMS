plugins {
  id 'java'
  id 'com.github.johnrengelman.shadow' version '8.1.1'
}

repositories {
  mavenCentral()
  maven { url "https://repo.spring.io/milestone" }
  maven { url "https://repo.spring.io/snapshot" }
}

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-web:3.4.5'
  implementation 'com.amazonaws.serverless:aws-serverless-java-container-springboot3:2.0.2'

  testImplementation 'org.apache.httpcomponents.client5:httpclient5:5.5'
  testImplementation platform('org.junit:junit-bom:5.13.1')
  testImplementation 'org.junit.jupiter:junit-jupiter'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.test {
  useJUnitPlatform()
}

tasks.named('shadowJar') {
  archiveBaseName.set('ems-backend')
  archiveClassifier.set('')
  archiveVersion.set('0.0.1')  // or use project.version if defined
  manifest {
    attributes 'Main-Class': 'com.harshita.ems.StreamLambdaHandler'
  }
}

build.dependsOn(shadowJar)
