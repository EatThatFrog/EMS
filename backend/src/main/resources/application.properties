# Spring Boot application properties for AWS Lambda deployment

# Reduce logging level to make sure the application works with Lambda
logging.level.root=WARN
logging.level.com.harshita.ems=INFO

# Configure Spring MVC
spring.mvc.servlet.load-on-startup=1

# Disable embedded server when running in Lambda
spring.main.web-application-type=servlet

# Configure JSON serialization
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSZ